---
version: 3
 
images:
  base_image:
    name: "registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest"
    signature_original_name: "registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest"
 
dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt
 
additional_build_files:
  - src: ansible.cfg
    dest: configs/ansible.cfg
 
additional_build_steps:
  prepend_galaxy:
    - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_AUTH_URL=https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    - ENV ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_URL=https://cloud.redhat.com/api/automation-hub/
    - ENV ANSIBLE_GALAXY_CLI_COLLECTION_OPTS=--pre
 
  prepend_final:
    - RUN microdnf install -y python3-pip && microdnf clean all
