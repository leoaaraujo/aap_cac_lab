name: Dynamic AAP Job Template Trigger

on:
  workflow_dispatch:
  push:
    branches:
      - aap-cac-demo
    paths:
      - 'cac/orgs_vars/**'

permissions:
  contents: read

jobs:
  detect-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Organizations
        id: changed-orgs
        run: |
          set -euo pipefail

          FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)

          echo "Changed files:"
          echo "$FILES"

          CHANGED_ORGS=$(echo "$FILES" | \
            awk -F'/' '/^cac\/orgs_vars\// {print $3}' | \
            sort -u | \
            tr '\n' ' ' || true)

          echo "Detected organizations: $CHANGED_ORGS"
          echo "orgs=$CHANGED_ORGS" >> "$GITHUB_OUTPUT"

      - name: Trigger AAP Job Templates
        if: steps.changed-orgs.outputs.orgs != ''
        env:
          AAP_URL: ${{ secrets.AAP_URL }}
          AAP_TOKEN: ${{ secrets.AAP_TOKEN }}
        run: |
          set -euo pipefail

          for ORG in ${{ steps.changed-orgs.outputs.orgs }}; do
            echo "----------------------------------------"
            echo "Processing organization: $ORG"
            echo "----------------------------------------"

            JT_NAME="${ORG} JT_CaC_Ctrl_Config"
            JT_NAME_ENCODED=$(printf '%s' "$JT_NAME" | jq -sRr @uri)

            TEMPLATE_SEARCH_URL="${AAP_URL}/api/controller/v2/job_templates/?name=${JT_NAME_ENCODED}"

            echo "Searching Job Template: $JT_NAME"

            TEMPLATE_ID=$(curl -k -s \
              -H "Authorization: Bearer ${AAP_TOKEN}" \
              -H "Accept: application/json" \
              "$TEMPLATE_SEARCH_URL" | jq -r '.results[0].id // empty')

            if [ -z "$TEMPLATE_ID" ]; then
              echo "Could not find Job Template: $JT_NAME"
              exit 1
            fi

            echo "Found Job Template ID: $TEMPLATE_ID"

            RESPONSE=$(curl -k -s -X POST \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${AAP_TOKEN}" \
              "${AAP_URL}/api/controller/v2/job_templates/${TEMPLATE_ID}/launch/")

            echo "AAP launch response:"
            echo "$RESPONSE"

            JOB_ID=$(echo "$RESPONSE" | jq -r '.job // empty')

            if [ -n "$JOB_ID" ]; then
              echo "Successfully triggered AAP Job ID: $JOB_ID"
              echo "Monitor: ${AAP_URL}/#/jobs/playbook/${JOB_ID}"
            else
              echo "Failed to launch Job Template: $JT_NAME"
              exit 1
            fi
          done
