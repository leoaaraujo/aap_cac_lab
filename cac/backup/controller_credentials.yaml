---
controller_credentials:
  - name: "Customer A GH Credential"
    description: |-
      {%- raw -%}
      GitHub Credential
      {%- endraw -%}
    credential_type: "Source Control"
    organization: "Customer A"
    inputs:
      password: "{{ vaulted_controller_credentials_customer_a_gh_credential_password }}"
      username: leoaaraujo
  - name: "Customer A Vault Credential"
    description: |-
      {%- raw -%}
      Vault Credential
      {%- endraw -%}
    credential_type: "Vault"
    organization: "Customer A"
    inputs:
      vault_password: "{{ vaulted_controller_credentials_customer_a_vault_credential_vault_password }}"
  - name: "Customer A AAP Credential"
    description: |-
      {%- raw -%}
      Ansible Automation Platform Credential
      {%- endraw -%}
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Customer A"
    inputs:
      host: aap.nspdq.sandbox5146.opentlc.com
      password: "{{ vaulted_controller_credentials_customer_a_aap_credential_password }}"
      username: lab-user
      verify_ssl: false
...
