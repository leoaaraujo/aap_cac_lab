---
controller_templates:
  - name: "{{ orgs }} JT_CasC_Ctrl_Config"
    description: "Template to deploy Controller objects in Org"
    organization: "{{ orgs }}"
    project: "{{ orgs }} CasC_Data"
    inventory: "{{ orgs }} Localhost"
    playbook: "cac_ctrl_config.yml"
    job_type: run
    fact_caching_enabled: false
    credentials:
      - "{{ orgs }} AAP Credential"
      - "{{ orgs }} Vault Credential"
    concurrent_jobs_enabled: true
    ask_scm_branch_on_launch: true
    ask_tags_on_launch: true
    ask_verbosity_on_launch: true
    ask_variables_on_launch: true
    extra_vars:
      ansible_python_interpreter: /usr/bin/python3
      ansible_async_dir: /home/runner/.ansible_async/
      # Orgs managed as code
      orgs: "{{ orgs }}"
      dir_orgs_vars: orgs_vars  
    execution_environment: "ee-casc"
...
