---
controller_projects:
  - name: "{{ orgs }} CasC_Data"
    description: "Project to include Casc_Data"
    organization: "{{ orgs }}"
    scm_type: git
    scm_credential: "{{ orgs }} GH Credential"      
    scm_url: "https://github.com/leoaaraujo/aap_cac_lab.git"
    scm_branch: "{{ cac_gitlab_scm_branch | default('main') }}"
    scm_clean: false
    scm_delete_on_update: false
    scm_update_on_launch: true
    scm_update_cache_timeout: 86400
    allow_override: true
...
