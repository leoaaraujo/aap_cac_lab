---
controller_credentials:
  - name: "{{ orgs }} AAP Credential"
    description: "Ansible Automation Platform Credential"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "{{ orgs }}"
    inputs:
      host: "{{ aap_hostname }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "{{ orgs }} GH Credential"
    description: "GitHub Credential"
    credential_type: "Source Control"
    organization: "{{ orgs }}"
    inputs:
      username: 'leoaaraujo'
      password: "{{ vault_customerb_github_token }}"

  - name: "{{ orgs }} Vault Credential"
    description: "Vault Credential"
    credential_type: "Vault"
    organization: "{{ orgs }}"
    inputs:
      vault_password: "{{ vault_pass }}"
